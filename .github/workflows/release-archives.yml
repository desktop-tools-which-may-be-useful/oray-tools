name: release-archives

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/termux/**'
      - '.github/workflows/release-archives.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android,
            aarch64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf,
            x86_64-pc-windows-gnu

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Install Debian and Windows cross toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            gcc-mingw-w64-x86-64

      - name: Cross-compile Termux binaries
        env:
          NDK_TOOLCHAIN: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64
        run: |
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_TOOLCHAIN/bin/aarch64-linux-android24-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_AR="$NDK_TOOLCHAIN/bin/llvm-ar"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$NDK_TOOLCHAIN/bin/armv7a-linux-androideabi24-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_AR="$NDK_TOOLCHAIN/bin/llvm-ar"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_TOOLCHAIN/bin/x86_64-linux-android24-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_AR="$NDK_TOOLCHAIN/bin/llvm-ar"

          export CC_aarch64_linux_android="$NDK_TOOLCHAIN/bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$NDK_TOOLCHAIN/bin/llvm-ar"
          export CC_armv7_linux_androideabi="$NDK_TOOLCHAIN/bin/armv7a-linux-androideabi24-clang"
          export AR_armv7_linux_androideabi="$NDK_TOOLCHAIN/bin/llvm-ar"
          export CC_x86_64_linux_android="$NDK_TOOLCHAIN/bin/x86_64-linux-android24-clang"
          export AR_x86_64_linux_android="$NDK_TOOLCHAIN/bin/llvm-ar"

          cargo build --target aarch64-linux-android --release --locked
          cargo build --target armv7-linux-androideabi --release --locked
          cargo build --target x86_64-linux-android --release --locked

          mkdir -p target/termux/aarch64 target/termux/arm target/termux/x86_64
          cp target/aarch64-linux-android/release/oray-tools target/termux/aarch64/oray-tools
          cp target/armv7-linux-androideabi/release/oray-tools target/termux/arm/oray-tools
          cp target/x86_64-linux-android/release/oray-tools target/termux/x86_64/oray-tools

      - name: Build Debian binaries
        run: |
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_AR=aarch64-linux-gnu-ar
          export CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc
          export CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_AR=arm-linux-gnueabihf-ar
          export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
          export AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar
          export CC_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-gcc
          export AR_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-ar

          cargo build --release --locked
          cargo build --target aarch64-unknown-linux-gnu --release --locked
          cargo build --target armv7-unknown-linux-gnueabihf --release --locked

          mkdir -p target/debian/amd64 target/debian/arm64 target/debian/armhf
          cp target/release/oray-tools target/debian/amd64/oray-tools
          cp target/aarch64-unknown-linux-gnu/release/oray-tools target/debian/arm64/oray-tools
          cp target/armv7-unknown-linux-gnueabihf/release/oray-tools target/debian/armhf/oray-tools

      - name: Build Windows binary (mingw, static CRT)
        run: |
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_AR=x86_64-w64-mingw32-ar
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS="-C target-feature=+crt-static"
          export CC_x86_64_pc_windows_gnu=x86_64-w64-mingw32-gcc
          export AR_x86_64_pc_windows_gnu=x86_64-w64-mingw32-ar

          cargo build --target x86_64-pc-windows-gnu --release --locked

          mkdir -p target/windows/x86_64
          cp target/x86_64-pc-windows-gnu/release/oray-tools.exe target/windows/x86_64/oray-tools.exe

      - name: Package .deb files
        run: |
          chmod +x scripts/termux/mkdeb.sh
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"

          mkdir -p repo/termux/pool/main
          for arch in aarch64 arm x86_64; do
            BIN="$(find "target/termux/$arch" -type f -name oray-tools | head -1)"
            [ -n "$BIN" ] || { echo "no binary for $arch" >&2; exit 1; }
            scripts/termux/mkdeb.sh "$BIN" "$VERSION" "$arch" "repo/termux/pool/main/oray-tools_${VERSION}_${arch}.deb" termux
          done

          mkdir -p repo/debian/pool/main
          for arch in amd64 arm64 armhf; do
            BIN="$(find "target/debian/$arch" -type f -name oray-tools | head -1)"
            [ -n "$BIN" ] || { echo "no binary for $arch" >&2; exit 1; }
            scripts/termux/mkdeb.sh "$BIN" "$VERSION" "$arch" "repo/debian/pool/main/oray-tools_${VERSION}_${arch}.deb" debian
          done

      - name: Package Windows binaries
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          mkdir -p repo/windows
          for arch in x86_64; do
            EXE="oray-tools-${VERSION}-${arch}.exe"
            cp "target/windows/$arch/oray-tools.exe" "repo/windows/$EXE"
            sha256sum "repo/windows/$EXE" | cut -d' ' -f1 > "repo/windows/$EXE.sha256"
          done
          echo "== DLL imports (must be Windows system DLLs only) =="
          for f in repo/windows/*.exe; do echo "$f:"; objdump -p "$f" | grep -E 'DLL Name|file format' || true; done
          python3 scripts/termux/mkindex.py "$VERSION" repo/windows > repo/windows/index.html
          ls -la repo/windows

      - name: Generate apt repository metadata
        env:
          GPG_KEY: ${{ secrets.REPO_GPG_KEY }}
        run: |
          python3 scripts/termux/mkrepo.py repo/termux \
            --label "oray-tools (Termux)" --origin "oray-tools-termux" \
            --desc "oray-tools Termux repository"
          python3 scripts/termux/mkrepo.py repo/debian \
            --label "oray-tools (Debian)" --origin "oray-tools-debian" \
            --desc "oray-tools Debian/Ubuntu repository"

      - name: Verify repository layout
        run: |
          find repo -type f | sort
          awk '/^Package:/{print}' repo/termux/dists/stable/main/binary-aarch64/Packages
          awk '/^Package:/{print}' repo/debian/dists/stable/main/binary-amd64/Packages
          awk '/^Package:/{print}' repo/debian/dists/stable/main/binary-arm64/Packages
          file repo/windows/*.exe

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: repo
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4